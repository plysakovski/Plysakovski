name: Generate Contribution Snake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238B5CF6&color_dots=%23EEEAF5,%23DED2FF,%23C4B5FD,%23A78BFA,%238B5CF6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F6C85F&color_dots=%2313101C,%232F244A,%235B3D8D,%238B5CF6,%23A78BFA

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
